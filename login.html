<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة غزة للعقارات - تسجيل الدخول</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/main.css">

</head>
<body>

<div class="auth-page">
  <div class="container">
    <div class="auth-card">
      <div class="row g-0">
        <!-- Image Side -->
        <div class="col-lg-5 d-none d-lg-block">
          <div class="auth-image">
            <div class="auth-image-content text-start">
              <h3 class="fw-bold mb-2">مرحباً بك مجدداً!</h3>
              <p class="mb-0 text-white-50">انضم إلى أكبر مجتمع عقاري في غزة.</p>
            </div>
          </div>
        </div>
        
        <!-- Form Side -->
        <div class="col-lg-7">
          <div class="auth-form-container">
            <div class="auth-header">
              <a href="index.html" class="text-decoration-none">
                <div class="brand-icon"><i class="bi bi-buildings text-white fs-3"></i></div>
                <h2>تسجيل الدخول</h2>
              </a>
              <p>مرحباً بعودتك! يرجى إدخال بياناتك للمتابعة.</p>
            </div>
            
            <form action="dashboard/user-index.html" method="get">
              <div class="form-group-custom">
                <label class="form-label-custom">البريد الإلكتروني</label>
                <input type="email" class="form-control-custom" placeholder="أدخل بريدك الإلكتروني" required>
              </div>
              
              <div class="form-group-custom">
                <div class="d-flex justify-content-between mb-2">
                  <label class="form-label-custom mb-0">كلمة المرور</label>
                  <a href="#" class="forgot-password-link">نسيت كلمة المرور؟</a>
                </div>
                <input type="password" class="form-control-custom" placeholder="أدخل كلمة المرور" required>
              </div>
              
              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label remember-me-label" for="rememberMe">
                  تذكرني على هذا الجهاز
                </label>
              </div>
              
              <button type="submit" class="btn-primary-custom w-100 justify-content-center btn-auth-submit">
                تسجيل الدخول <i class="bi bi-box-arrow-in-right"></i>
              </button>
            </form>
            
            <div class="divider">أو الدخول بواسطة</div>
            
            <div class="social-login">
              <button class="btn-social">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" width="18">
                جوجل
              </button>
              <button class="btn-social">
                <i class="bi bi-facebook facebook-icon"></i>
                فيسبوك
              </button>
            </div>
            
            <p class="text-center mt-4 mb-0 auth-footer-text">
              ليس لديك حساب؟ <a href="register.html" class="text-primary-custom fw-bold">إنشاء حساب جديد</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
